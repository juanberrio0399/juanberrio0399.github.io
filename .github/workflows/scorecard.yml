name: OpenSSF Scorecard

# Scores the repository against the OpenSSF checks (pinned dependencies, token permissions,
# dangerous workflow patterns, security policy). The result feeds the Scorecard API behind the
# README badge and is uploaded as SARIF, so findings show up in the Security tab.
on:
  # Weekly: the checks and the ecosystem move even when this repository does not.
  schedule:
    - cron: '17 6 * * 2'
  push:
    branches: [ main ]
  # A PR that touches CI or security config is scored before it reaches main.
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF to code scanning.
      security-events: write
      # OIDC token: publish_results signs the published result with it.
      id-token: write
      contents: read
    steps:
      # Same first step as Lighthouse CI: record the job's egress in audit mode.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Only runs on main publish: the repository's public score must not come from a
          # working branch. On a PR the analysis still runs and reports locally.
          publish_results: ${{ github.event_name != 'pull_request' }}

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
