name: OpenSSF Scorecard

# Scores the repository against the OpenSSF checks (pinned dependencies, token permissions,
# dangerous workflow patterns, security policy). The result feeds the Scorecard API behind the
# README badge and is uploaded as SARIF, so findings show up in the Security tab.
on:
  # Weekly: the checks and the ecosystem move even when this repository does not.
  schedule:
    - cron: '17 6 * * 2'
  push:
    branches: [ main ]
  # A PR that touches CI or security config is scored before it reaches main.
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF to code scanning.
      security-events: write
      # OIDC token: publish_results signs the published result with it.
      id-token: write
      contents: read
    steps:
      # Same first step as Lighthouse CI: record the job's egress in audit mode.
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Only runs on main publish: the repository's public score must not come from a
          # working branch. On a PR the analysis still runs and reports locally.
          publish_results: ${{ github.event_name != 'pull_request' }}

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
