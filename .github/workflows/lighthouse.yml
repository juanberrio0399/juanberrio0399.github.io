name: Lighthouse CI

# Audits the site served from the repository folder, not the live URL, so a pull request scores
# its own changes before they reach main. URLs and thresholds live in .lighthouserc.json.
# `lighthouse` is the required check on main: if this job fails the PR cannot merge.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      # Always first: records which hosts the job talks to and flags file tampering.
      # Audit mode only reports; switching it to block needs that egress list first.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit with Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
