name: Lighthouse CI

# Audita el sitio servido desde los archivos del repo (no la URL en vivo), así un PR
# muestra su propio puntaje antes de llegar a main. Umbrales en .lighthouserc.json.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      # Primer paso siempre: registra a qué dominios sale el job (egress) y detecta
      # manipulación de archivos. En modo audit no bloquea nada todavía.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Audit with Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
