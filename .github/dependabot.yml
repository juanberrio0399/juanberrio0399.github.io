version: 2
updates:
  # Actions are pinned by commit SHA, not by tag, so nothing updates them on its own:
  # Dependabot is what moves the SHA and its version comment. One grouped PR a week,
  # because five separate bumps a week would stop being read.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
    labels:
      - dependencies
